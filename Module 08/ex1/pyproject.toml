[tool.poetry]
name = "loading"
version = "0.1.0"
description = "Matrix loading exercise with pip and Poetry dependency management"
authors = ["student <student@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
matplotlib = "^3.8.0"
requests = "^2.32.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
